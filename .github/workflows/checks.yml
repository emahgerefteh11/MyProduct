name: Billing and dashboard regression checks

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node tests/dashboard.test.cjs
      - name: Check the generated demo is current
        run: |
          python generate_dashboard.py
          git diff --exit-code -- dashboard_demo.html
