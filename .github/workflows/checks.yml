name: Billing and dashboard regression checks

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node tests/dashboard.test.cjs
      - run: node tests/import.test.cjs
      - run: node tests/adoption.test.cjs
      - name: Check the generated demo is current
        run: |
          python generate_dashboard.py
          git diff --exit-code -- dashboard_demo.html
      - name: Check the isolated preview is current
        run: |
          python build_preview.py
          git diff --exit-code -- preview/

  adoption-terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - run: python tests/terraform_adoption_smoke.py

  browser-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_import.py
      - run: python tests/browser_dashboard.py
        env:
          ATLAS_REVIEW_SCREENSHOTS: ${{ startsWith(github.ref, 'refs/heads/codex/modern-workspace-') && '1' || '0' }}
      - run: python tests/browser_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-browser-screenshots
          path: test-artifacts/
          retention-days: 7
